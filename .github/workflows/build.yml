name: Build extension bundle

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build minified bundle
        run: bash scripts/build.sh

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: video-controller-bundle
          path: video-controller-v*.zip

      - name: Read manifest version
        id: version
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      # Creates the tag + release automatically from the manifest version.
      # Re-pushing main without bumping the version updates the same
      # release's zip instead of creating a new one.
      - name: Create / update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: video-controller-v*.zip
          generate_release_notes: true
